server:
  port: 8081
spring:
  application:
    name: User-service
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        instance-id: ${spring.application.name}-${random.value}
  config:
    import: optional:configserver:${URL}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
resilience4j:
  circuit-breaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always



