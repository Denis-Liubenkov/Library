version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper
    hostname: zookeeper
    ports:
      - "22181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_FORCE_RECOVERY: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app-network

  books-service:
    container_name: books-service
    build:
      context: ./books-service
      dockerfile: Dockerfile
    image: books-service
    networks:
      - app-network
    ports:
      - "8082:8082"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      #- SPRING_CONFIG_IMPORT="optional:configserver:http://сonfig-server:8889"
      - SPRING_APPLICATION_NAME=books-service
      - SPRING_DATASOURCE_URL_BOOKS=jdbc:postgresql://postgres:5432/Books
      - SPRING_DATASOURCE_USERNAME_BOOKS=postgres
      - SPRING_DATASOURCE_PASSWORD_BOOKS=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME_BOOKS=org.postgresql.Driver
      - SPRING_DATA_MONGODB_URI_BOOKS=mongodb://mongodb:27017/FileData
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - config-server
      - postgres
      - mongodb
      - kafka

  config-server:
    container_name: Config-server
    build:
      context: ./Config-server
      dockerfile: Dockerfile
    image: config-server
    networks:
      - app-network
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=native
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - consul
      - kafka

  AuthenticationMs:
    container_name: AuthenticationMs
    build:
      context: ./AuthenticationMs
      dockerfile: Dockerfile
    image: authenticationms
    networks:
      - app-network
    ports:
      - "8084:8084"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      #- SPRING_CONFIG_IMPORT="optional:configserver:http://сonfig-server:8889"
      - SPRING_APPLICATION_NAME=AuthenticationMs
      - SPRING_DATASOURCE_URL_AUTH=jdbc:postgresql://postgres:5432/SecurityCredentials
      - SPRING_DATASOURCE_USERNAME_AUTH=postgres
      - SPRING_DATASOURCE_PASSWORD_AUTH=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME_AUTH=org.postgresql.Driver
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - config-server
      - postgres
      - kafka

  User-service:
    container_name: User-service
    build:
      context: ./User-service
      dockerfile: Dockerfile
    image: user-service
    networks:
      - app-network
    ports:
      - "8081:8081"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      #- SPRING_CONFIG_IMPORT="optional:configserver:http://сonfig-server:8889"
      - SPRING_DATASOURCE_URL_USERS=jdbc:postgresql://postgres:5432/Users
      - SPRING_DATASOURCE_USERNAME_USERS=postgres
      - SPRING_DATASOURCE_PASSWORD_USERS=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME_USERS=org.postgresql.Driver
      - SPRING_APPLICATION_NAME=User-service
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - config-server
      - postgres
      - kafka

  Order-service:
    container_name: Order-service
    build:
      context: ./Order-service
      dockerfile: Dockerfile
    image: order-service
    networks:
      - app-network
    ports:
      - "8083:8083"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      #- SPRING_CONFIG_IMPORT="optional:configserver:http://сonfig-server:8889"
      - SPRING_APPLICATION_NAME=Order-service
      - SPRING_DATASOURCE_URL_ORDERS=jdbc:postgresql://postgres:5432/Orders
      - SPRING_DATASOURCE_USERNAME_ORDERS=postgres
      - SPRING_DATASOURCE_PASSWORD_ORDERS=root
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME_ORDERS=org.postgresql.Driver
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - config-server
      - postgres
      - kafka

  Gateway:
    container_name: Gateway
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    image: gateway
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      #- SPRING_CONFIG_IMPORT="optional:configserver:http://сonfig-server:8889"
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
      - config-server
      - kafka

  postgres:
    image: postgres
    networks:
      - app-network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=template1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_is ready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    networks:
      - app-network
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=admin
    volumes:
      - mongodb_data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.runCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul
    networks:
      - app-network
    ports:
      - "8500:8500"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    restart: always
    volumes:
      - consul_data:/consul/data

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  consul_data:
  mongodb_data:
  kafka_data:
